name: CI

on:
  push:
    branches: [ main, "muddassir-khan/*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run service & activity unit tests
      run: pytest tests/test_api.py tests/test_temporal_activities.py -v
      env:
        PYTHONPATH: ${{ github.workspace }}
        TICKETS_DB_PATH: ${{ runner.temp }}/tickets-${{ matrix.python-version }}.db
        NOTIFY_LOG_PATH: ${{ runner.temp }}/notify-${{ matrix.python-version }}.log

    - name: Run client integration tests (Temporal mocked)
      run: pytest tests/test_client.py -v
      env:
        PYTHONPATH: ${{ github.workspace }}
        TICKETS_DB_PATH: ${{ runner.temp }}/tickets-client-${{ matrix.python-version }}.db
        NOTIFY_LOG_PATH: ${{ runner.temp }}/notify-client-${{ matrix.python-version }}.log
